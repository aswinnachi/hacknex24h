version: "3.8"

services:
  ai-vision-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_vision_security_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DATABASE_URL=sqlite:////app/database/app.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - STORAGE_LOCAL_DIR=/app/data/storage
      - MAX_UPLOAD_SIZE_MB=250.0
      - FRAME_SAMPLING_FPS=1.0
    volumes:
      - ./data:/app/data
      - ./database:/app/database
      - ./weights:/app/weights

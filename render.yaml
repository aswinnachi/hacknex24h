services:
  - type: web
    name: ai-vision-security-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DATABASE_URL
        value: sqlite:////tmp/app.db
      - key: STORAGE_LOCAL_DIR
        value: /tmp/storage
      - key: MAX_UPLOAD_SIZE_MB
        value: "250.0"
      - key: CORS_ORIGINS
        value: "https://ai-vision-security-frontend.vercel.app,https://*.vercel.app,http://localhost:3000"
